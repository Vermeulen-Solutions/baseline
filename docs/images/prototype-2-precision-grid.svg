<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" fill="none">
  <style>
    .bg { fill: transparent; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.12em; }
    .text-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
    
    /* Default / Dark Mode */
    .icon-tile { fill: #090d16; stroke: #1e293b; }
    .col-track { fill: #1e293b; opacity: 0.45; }
    .grid-line { stroke: #334155; stroke-dasharray: 2 2; }
    .axis-solid { stroke: #06b6d4; stroke-width: 2; }
    .em-dash-core { fill: #38bdf8; }
    .target-corner { stroke: #06b6d4; stroke-width: 1.5; }
    .text-primary { fill: #f8fafc; }
    .text-muted { fill: #94a3b8; }
    .badge { fill: #1e293b; stroke: #334155; }
    .badge-text { fill: #38bdf8; }

    @media (prefers-color-scheme: light) {
      .icon-tile { fill: #ffffff; stroke: #e2e8f0; }
      .col-track { fill: #f1f5f9; opacity: 0.8; }
      .grid-line { stroke: #cbd5e1; stroke-dasharray: 2 2; }
      .axis-solid { stroke: #0891b2; stroke-width: 2; }
      .em-dash-core { fill: #0284c7; }
      .target-corner { stroke: #0891b2; stroke-width: 1.5; }
      .text-primary { fill: #0f172a; }
      .text-muted { fill: #64748b; }
      .badge { fill: #f8fafc; stroke: #e2e8f0; }
      .badge-text { fill: #0284c7; }
    }
  </style>

  <rect width="680" height="140" class="bg" />

  <!-- Icon Mark: The Precision Grid & Alignment Target -->
  <g transform="translate(20, 20)">
    <!-- Container Shell -->
    <rect x="0" y="0" width="100" height="100" rx="16" class="icon-tile" stroke-width="1.5" />
    
    <!-- 3 Column Container Tracks (Layout Guide G) -->
    <rect x="16" y="16" width="18" height="68" rx="2" class="col-track" />
    <rect x="41" y="16" width="18" height="68" rx="2" class="col-track" />
    <rect x="66" y="16" width="18" height="68" rx="2" class="col-track" />
    
    <!-- Precision Crosshair / Target Corners -->
    <path d="M 12 28 L 12 16 L 24 16" class="target-corner" />
    <path d="M 88 28 L 88 16 L 76 16" class="target-corner" />
    <path d="M 12 72 L 12 84 L 24 84" class="target-corner" />
    <path d="M 88 72 L 88 84 L 76 84" class="target-corner" />
    
    <!-- Central Alignment Baseline Axis -->
    <line x1="8" y1="50" x2="92" y2="50" class="axis-solid" />
    
    <!-- Em Dash centered at datum intersection -->
    <rect x="25" y="44" width="50" height="12" rx="3" class="em-dash-core" />
  </g>

  <!-- Wordmark & Subtitle -->
  <g transform="translate(145, 62)">
    <text x="0" y="0" class="text-title text-primary">BASELINE</text>
    <text x="2" y="28" class="text-tag text-muted">VISUAL HARNESS · AI AGENT WORKFLOW</text>
  </g>
</svg>
