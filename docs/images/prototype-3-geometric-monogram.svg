<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" fill="none">
  <style>
    .bg { fill: transparent; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
    .text-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; }
    
    /* Default / Dark Mode */
    .icon-tile { fill: #0f172a; stroke: #334155; }
    .stem { fill: #f8fafc; }
    .bar-top { fill: #38bdf8; }
    .bar-bottom { fill: #0284c7; }
    .baseline-rule { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; }
    .text-primary { fill: #f8fafc; }
    .text-muted { fill: #94a3b8; }
    .dot { fill: #38bdf8; }

    @media (prefers-color-scheme: light) {
      .icon-tile { fill: #f8fafc; stroke: #cbd5e1; }
      .stem { fill: #0f172a; }
      .bar-top { fill: #0284c7; }
      .bar-bottom { fill: #0369a1; }
      .baseline-rule { stroke: #0284c7; stroke-width: 2.5; stroke-linecap: round; }
      .text-primary { fill: #0f172a; }
      .text-muted { fill: #64748b; }
      .dot { fill: #0284c7; }
    }
  </style>

  <rect width="680" height="140" class="bg" />

  <!-- Icon Mark: The Geometric 'B' Monogram -->
  <g transform="translate(20, 20)">
    <!-- Rounded Background Tile -->
    <rect x="0" y="0" width="100" height="100" rx="20" class="icon-tile" stroke-width="1.5" />
    
    <!-- Vertical Stem of 'B' -->
    <rect x="26" y="24" width="12" height="52" rx="3" class="stem" />
    
    <!-- Top Em Dash (Upper lobe) -->
    <rect x="44" y="24" width="30" height="12" rx="3" class="bar-top" />
    
    <!-- Bottom Em Dash (Lower lobe) -->
    <rect x="44" y="44" width="30" height="12" rx="3" class="bar-bottom" />
    
    <!-- Extended Horizontal Baseline Datum -->
    <line x1="20" y1="76" x2="80" y2="76" class="baseline-rule" />
  </g>

  <!-- Wordmark & Subtitle -->
  <g transform="translate(145, 62)">
    <text x="0" y="0" class="text-title text-primary">Baseline<tspan class="dot">.</tspan></text>
    <text x="2" y="26" class="text-tag text-muted">The Visual Frontend Harness for EmDash &amp; Astro</text>
  </g>
</svg>
