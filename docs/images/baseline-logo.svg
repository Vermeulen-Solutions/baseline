<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 132" fill="none" role="img" aria-labelledby="baseline-logo-title baseline-logo-desc">
  <title id="baseline-logo-title">Baseline</title>
  <desc id="baseline-logo-desc">Baseline — Agent-First Web Starter for Astro and EmDash CMS</desc>

  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="tile-dark" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="tile-border-dark" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="54" cy="48" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Light Mode Gradients -->
    <linearGradient id="tile-light" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="tile-border-light" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="glow-light" cx="54" cy="48" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- EmDash & Datum Gradients -->
    <linearGradient id="emdash-grad" x1="36" y1="36" x2="78" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="baseline-grad" x1="14" y1="72" x2="82" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: transparent; }

    /* Default: Dark Mode */
    .icon-tile { fill: url(#tile-dark); stroke: url(#tile-border-dark); stroke-width: 1.5; }
    .icon-glow { fill: url(#glow-dark); }
    .icon-inner-rim { stroke: #64748b; stroke-opacity: 0.22; stroke-width: 1; }
    .guide-line { stroke: #334155; stroke-opacity: 0.7; stroke-dasharray: 2 3; stroke-width: 1; }
    .monogram-primary { fill: #f8fafc; }
    .monogram-bowl { fill: #e2e8f0; }
    .emdash-bar { fill: url(#emdash-grad); }
    .datum-line { stroke: url(#baseline-grad); stroke-width: 2.5; stroke-linecap: round; }
    .caliper-tick { stroke: #38bdf8; stroke-width: 1.75; stroke-linecap: round; }
    .caliper-mid { stroke: #64748b; stroke-width: 1.25; stroke-linecap: round; }
    .wordmark { fill: #f8fafc; }
    .wordmark-dash { fill: url(#emdash-grad); }
    .rule-track { stroke: #1e293b; stroke-width: 1.5; stroke-linecap: round; }
    .rule-accent { stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; }
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.175em;
      fill: #94a3b8;
    }
    .subtitle-accent { fill: #38bdf8; }

    @media (prefers-color-scheme: light) {
      .icon-tile { fill: url(#tile-light); stroke: url(#tile-border-light); }
      .icon-glow { fill: url(#glow-light); }
      .icon-inner-rim { stroke: #ffffff; stroke-opacity: 0.9; }
      .guide-line { stroke: #cbd5e1; stroke-opacity: 0.85; }
      .monogram-primary { fill: #0f172a; }
      .monogram-bowl { fill: #1e293b; }
      .caliper-tick { stroke: #0284c7; }
      .caliper-mid { stroke: #94a3b8; }
      .wordmark { fill: #0f172a; }
      .rule-track { stroke: #e2e8f0; }
      .rule-accent { stroke: #0284c7; }
      .subtitle { fill: #475569; }
      .subtitle-accent { fill: #0284c7; }
    }
  </style>

  <rect width="468" height="132" class="bg" />

  <!-- =======================================================================
       ICON MARK: Architectural Stencil 'B' + Em-Dash Core + Baseline Caliper
       ======================================================================= -->
  <g transform="translate(16, 18)">
    <!-- Squircle Chassis -->
    <rect x="0" y="0" width="96" height="96" rx="22" class="icon-tile" />
    <circle cx="52" cy="44" r="38" class="icon-glow" />
    <rect x="1.5" y="1.5" width="93" height="93" rx="20.5" class="icon-inner-rim" />

    <!-- Typographic Cap-Height (y=20) & Baseline-of-Glyph (y=60) Construction Guides -->
    <line x1="14" y1="20" x2="82" y2="20" class="guide-line" />
    <line x1="14" y1="60" x2="82" y2="60" class="guide-line" />

    <!-- Architectural Stencil 'B' Resting on Glyph Baseline (y=20..60) -->
    <!-- Left Vertical Pillar -->
    <rect x="22" y="20" width="10" height="40" rx="2.5" class="monogram-primary" />

    <!-- Upper Bowl of 'B' (Hollow Counter Loop, y=20..37) -->
    <path d="M36 20H56C62.5 20 67 23.6 67 28.5C67 33.4 62.5 37 56 37H36V30.5H54.5C56.8 30.5 58.2 29.7 58.2 28.5C58.2 27.3 56.8 26.5 54.5 26.5H36V20Z" class="monogram-bowl" />

    <!-- Lower Bowl / Signature Em-Dash Core (y=41..60) -->
    <path d="M36 41H61C68.5 41 73.5 45.0 73.5 50.5C73.5 56.0 68.5 60 61 60H36V53H59.5C62.2 53 64 52.0 64 50.5C64 49.0 62.2 48 59.5 48H36V41Z" class="emdash-bar" />

    <!-- The Authoritative Baseline Datum & Vernier Caliper (y = 73) -->
    <line x1="14" y1="73" x2="82" y2="73" class="datum-line" />
    <line x1="14" y1="68" x2="14" y2="78" class="caliper-tick" />
    <line x1="31" y1="70.5" x2="31" y2="75.5" class="caliper-mid" />
    <line x1="48" y1="69" x2="48" y2="77" class="caliper-tick" />
    <line x1="65" y1="70.5" x2="65" y2="75.5" class="caliper-mid" />
    <line x1="82" y1="68" x2="82" y2="78" class="caliper-tick" />
  </g>

  <!-- =======================================================================
       CUSTOM GEOMETRIC VECTOR WORDMARK: "BASELINE—"
       Cap-height: 28px (y=34..62), Stem: 5.5px — OS-independent precision
       ======================================================================= -->
  <g transform="translate(134, 0)">
    <g class="wordmark" fill-rule="evenodd" clip-rule="evenodd">
      <!-- B (x: 0..22) -->
      <path d="M0 34H13.5C18.2 34 21.2 36.5 21.2 40.7C21.2 43.6 19.6 45.8 17.0 46.8C20.2 47.7 22.2 50.2 22.2 53.7C22.2 58.6 18.8 62 13.5 62H0V34ZM5.6 38.8V45.1H12.6C14.7 45.1 15.8 43.9 15.8 41.9C15.8 40.0 14.7 38.8 12.6 38.8H5.6ZM5.6 49.7V57.2H13.1C15.4 57.2 16.7 55.9 16.7 53.5C16.7 51.1 15.4 49.7 13.1 49.7H5.6Z" />

      <!-- A (x: 31..57) -->
      <path d="M41.2 34H47.0L57.2 62H51.2L49.1 55.8H38.9L36.8 62H31.0L41.2 34ZM40.5 51.0H47.5L44.0 40.3L40.5 51.0Z" />

      <!-- S (x: 65..87) -->
      <path d="M76.2 33.5C82.4 33.5 86.5 36.6 86.8 41.6H81.1C80.8 39.3 79.1 38.1 76.1 38.1C73.3 38.1 71.5 39.3 71.5 41.2C71.5 42.9 72.9 43.9 76.0 44.6L79.2 45.3C84.7 46.5 87.3 49.0 87.3 53.6C87.3 58.9 83.0 62.5 76.2 62.5C69.5 62.5 65.2 59.2 64.9 53.9H70.6C70.9 56.5 73.0 57.9 76.4 57.9C79.5 57.9 81.6 56.5 81.6 54.4C81.6 52.6 80.3 51.5 77.1 50.8L73.7 50.0C68.6 48.9 65.9 46.3 65.9 41.8C65.9 36.8 70.1 33.5 76.2 33.5Z" />

      <!-- E (x: 97..118) -->
      <path d="M97.2 34H117.8V39.0H102.8V45.4H116.2V50.2H102.8V57.0H118.2V62H97.2V34Z" />

      <!-- L (x: 128..148) -->
      <path d="M128.4 34H134.0V57.0H148.0V62H128.4V34Z" />

      <!-- I (x: 157..163) -->
      <path d="M157.2 34H162.8V62H157.2V34Z" />

      <!-- N (x: 174..198) -->
      <path d="M174.0 34H179.5L192.4 53.0V34H197.8V62H192.5L179.4 42.8V62H174.0V34Z" />

      <!-- E (x: 209..230) -->
      <path d="M209.0 34H229.6V39.0H214.6V45.4H228.0V50.2H214.6V57.0H230.0V62H209.0V34Z" />
    </g>

    <!-- Em-Dash Terminal Accent aligned to baseline of wordmark -->
    <rect x="240" y="56.5" width="20" height="5.5" rx="2.75" class="wordmark-dash" />

    <!-- Architectural Divider Rule with Active Datum Segment (matches subtitle width) -->
    <line x1="0" y1="75" x2="316" y2="75" class="rule-track" />
    <line x1="0" y1="75" x2="72" y2="75" class="rule-accent" />

    <!-- Subtitle -->
    <text x="0" y="96" class="subtitle">
      ASTRO &amp; EMDASH CMS <tspan class="subtitle-accent">·</tspan> AGENT-FIRST WORKFLOW
    </text>
  </g>
</svg>
