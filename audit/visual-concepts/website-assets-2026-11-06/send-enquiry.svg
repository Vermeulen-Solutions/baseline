<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 176" role="img" aria-labelledby="send-enquiry-title send-enquiry-desc"><title id="send-enquiry-title">Send an enquiry</title><desc id="send-enquiry-desc">A completed message leads to an acknowledgement. This is a process illustration, not a working submission.</desc><style>:root{--paper:#fff;--ink:#0f172a;--muted:#64748b;--accent:#0284c7;--wash:#e0f2fe}@media(prefers-color-scheme:dark){:root{--paper:#0f172a;--ink:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--wash:#123047}}.panel{fill:var(--paper);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wash{fill:var(--wash);stroke:var(--accent);stroke-width:2}</style><rect class="panel" x="20" y="28" width="112" height="120" rx="8"/><path class="line" d="M36 48h64m-64 22h64m-64 12h48"/><rect class="wash" x="28" y="104" width="96" height="24" rx="4"/><path class="accent" d="M136 102h40m-7-7 7 7-7 7"/><rect class="panel" x="192" y="46" width="108" height="84" rx="8"/><path class="line" d="m194 50 52 36 52-36"/><path class="accent" d="m230 106 10 10 23-26"/></svg>