<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brilliant export</title>
<style>
  body { margin: 0; }
  :root {
    --color-action: #005198;
    --color-border: #c8ced8;
    --color-page: #fafcfe;
    --color-surface: #ffffff;
    --color-text: #1a2029;
  }
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 270px;">
  <div style="position: absolute; left: 0px; top: 0px; width: 390px; height: 270px; box-sizing: border-box; background-color: var(--color-page, #fafcfe);">
    <div style="position: absolute; left: 24px; top: 24px; width: 342px; height: 92px; box-sizing: border-box; font-size: 40px; font-family: 'Arial', system-ui, sans-serif; font-weight: 700; line-height: 1.15; text-align: left; color: var(--color-text, #1a2029); white-space: pre-wrap; overflow-wrap: break-word;">Build with Baseline</div>
    <div style="position: absolute; left: 24px; top: 128px; width: 342px; height: 118px; box-sizing: border-box; background-color: var(--color-surface, #ffffff); border-radius: 12px;">
      <div style="position: absolute; left: 24px; top: 24px; width: 294px; height: 21px; box-sizing: border-box; font-size: 18px; font-family: 'Arial', system-ui, sans-serif; line-height: 1.17; text-align: left; color: var(--color-text, #1a2029); white-space: pre-wrap; overflow-wrap: break-word;">Owner edit kept</div>
      <div style="position: absolute; left: 24px; top: 57px; width: 294px; height: 1px; box-sizing: border-box; background-color: var(--color-border, #c8ced8);"></div>
      <div style="position: absolute; left: 24px; top: 70px; width: 294px; height: 24px; box-sizing: border-box; background-color: var(--color-action, #005198);"></div>
    </div>
  </div>
</div>
</body>
</html>
