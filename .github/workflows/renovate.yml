name: Renovate
# Self-hosted Renovate pilot. Repository config: .github/renovate.json5. Setup and review procedure:
# docs/automated-upstream-updates.md. It runs as a GitHub App, so its pushes start the normal checks
# (pushes made with GITHUB_TOKEN would not). It runs only in Baseline's own repository, and only once
# the App is configured.
on:
  schedule:
    # Daily, so open pull requests are rebased and Dependency Dashboard ticks are acted on; new
    # proposals only open in the Monday window that renovate.json5 sets.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Look up and log updates without pushing branches or opening pull requests'
        type: boolean
        default: false
      log_level:
        description: 'Renovate log level'
        type: choice
        options: [info, debug]
        default: info
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    # Baseline's repository only: sites created from the template copy this file, and its config is
    # written for Baseline's maintainers. It also waits until the App is configured.
    if: github.repository == 'Vermeulen-Solutions/baseline' && vars.RENOVATE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get an installation token for the Renovate GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Run Renovate
        uses: renovatebot/github-action@v47.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repository carries its own config, so no onboarding pull request.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Commits go through the GitHub API, so they are made and signed by the App.
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          # The only post-upgrade command Renovate may run: the standards change note.
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/dependency-note\\.mjs$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
