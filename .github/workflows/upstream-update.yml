name: Upstream Dependency & Skill Auto-Update
on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 08:00 UTC
  workflow_dispatch:     # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check and update upstream skills and dependencies
        id: update
        run: |
          # 1. Update EmDash skills if staged without conflicts
          node scripts/sync-emdash-skills.mjs || true

          # 2. Update Impeccable skill
          node scripts/sync-impeccable-skill.mjs || true

          # 3. Apply safe in-range npm dependency updates
          npm update --save || true

          # Check if git working directory is dirty
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Everything is already up to date."
          fi

      - name: Run verification suite
        if: steps.update.outputs.has_changes == 'true'
        id: verify
        run: |
          npm run lint
          npm run check:schema-budget
          node --test tests/*.test.mjs
          npm run build

      - name: Push updates to main (Auto-Merge)
        if: steps.update.outputs.has_changes == 'true' && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deps): auto-update skills and dependencies [skip ci]"
          git push origin main

      - name: Notify on test failure
        if: failure() && steps.update.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Automated upstream update failed verification";
            const body = `The weekly automated update job encountered test or build failures when attempting to update upstream skills or dependencies.\n\nWorking tree was not merged to \`main\`.\n\nPlease check the [Actions run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['maintenance', 'automated-update']
            });
