name: Upstream dependency review
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  verify-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Propose in-range dependency updates
        run: npm update --save --no-audit --no-fund
      - name: Propose third-party skill updates (Impeccable & EmDash mirrors)
        run: npm run sync:upstream-skills
      - name: Prove the resulting lockfile installs cleanly
        run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
      - name: Verify both static profiles against the proposed dependency versions
        run: npm run test:profiles
      - name: Save the reviewed dependency proposal
        if: always()
        run: git diff --binary > upstream-update.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-dependency-review
          path: upstream-update.patch
      - name: Propose Pull Request (with Issue fallback)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No dependency or skill updates proposed."
            exit 0
          fi

          branch="automation/upstream-update"

          deps_diff=$(git diff package.json | grep -E '^\+[ ]+"' | sed 's/^+ *//' || true)
          skill_diff=$(git diff --stat .agents/skills/ .emdash/upstream-skills.json .emdash/impeccable-source.json || true)

          if [ -n "$deps_diff" ] && [ -n "$skill_diff" ]; then
            title="chore(upstream): weekly verified dependency and skill update review"
            issue_title="[Upstream Review] Verified dependency and skill updates available"
          elif [ -n "$skill_diff" ]; then
            title="chore(skills): weekly verified third-party skill update review"
            issue_title="[Upstream Review] Verified third-party skill updates available"
          else
            title="chore(deps): weekly verified upstream dependency review"
            issue_title="[Upstream Review] Verified dependency updates available"
          fi

          if [ -z "$deps_diff" ]; then
            deps_summary="In-range lockfile dependencies only (transitive updates)."
          else
            deps_summary=$(printf '%s\n%s\n%s' "\`\`\`json" "$deps_diff" "\`\`\`")
          fi

          body=$(printf '%s\n' \
            "## Verified Upstream Update Proposal" \
            "" \
            "Updates were proposed and verified in scheduled CI run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            "" \
            "### Dependency changes" \
            "$deps_summary")

          if [ -n "$skill_diff" ]; then
            body=$(printf '%s\n' \
              "$body" \
              "" \
              "### Third-party skill changes" \
              "\`\`\`" \
              "$skill_diff" \
              "\`\`\`")
          fi

          body=$(printf '%s\n' \
            "$body" \
            "" \
            "### Verification Results" \
            "* \`npm run verify\` passed (syntax, CSS contracts, lint, art direction, design tokens, unit & rehearsal tests, typecheck)." \
            "* \`npm run build\` passed." \
            "* \`npm run test:profiles\` passed (independent generation and builds for \`static\` and \`static-sveltia\`)." \
            "" \
            "### Review Guidance" \
            "Before merging, review [docs/starter-meta-review.md](docs/starter-meta-review.md), [docs/skill-synchronization.md](docs/skill-synchronization.md) and [docs/automated-upstream-updates.md](docs/automated-upstream-updates.md) for changelog and compatibility checks.")
          printf '%s\n' "$body" > /tmp/upstream-review-body.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add package.json package-lock.json .agents/skills/ .emdash/upstream-skills.json .emdash/impeccable-source.json
          git commit -m "$title"
          git push -f origin "$branch"

          existing_pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists for $branch; updating..."
            gh pr edit "$existing_pr" --title "$title" --body-file /tmp/upstream-review-body.md
            exit 0
          fi

          echo "Attempting to create Pull Request..."
          if gh pr create --title "$title" --body-file /tmp/upstream-review-body.md --head "$branch" --base main; then
            echo "Pull Request opened successfully."
            exit 0
          fi

          echo "PR creation failed (Actions PR permissions might be disabled in repo settings). Falling back to opening an Issue..."

          existing_issue=$(gh issue list --search "$issue_title" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          issue_body=$(printf '%s\n' \
            "$body" \
            "" \
            "---" \
            "> [!NOTE]" \
            "> A Pull Request could not be automatically created because this repository's GitHub Actions settings may require **\"Allow GitHub Actions to create and approve pull requests\"** to be enabled under **Settings > Actions > General**." \
            ">" \
            "> The verified changes have been pushed to branch \`$branch\`. You can open a PR from that branch or inspect locally:" \
            "> \`\`\`bash" \
            "> git fetch origin $branch" \
            "> git checkout $branch" \
            "> \`\`\`")
          printf '%s\n' "$issue_body" > /tmp/upstream-review-issue.md

          if [ -n "$existing_issue" ]; then
            echo "Updating existing issue #$existing_issue..."
            gh issue comment "$existing_issue" --body-file /tmp/upstream-review-issue.md
          else
            echo "Opening new issue..."
            gh issue create --title "$issue_title" --body-file /tmp/upstream-review-issue.md
          fi
