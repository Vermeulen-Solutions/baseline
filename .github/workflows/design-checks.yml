name: Design and build checks
on:
  pull_request:
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check art direction for changed visual source
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          # New branch (no base) or a force push whose previous tip no longer exists:
          # check the whole tree instead of failing on an unreachable diff base.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Diff base ${base:-none} is unavailable; checking the whole tree."
            base=$(git hash-object -t tree /dev/null)
          fi
          npm run check:art-direction -- --base "$base"
      - run: npm run check:ci-fast
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-fast-evidence
          path: .emdash/checks/ci-fast.*
      - run: npm run typecheck
  rehearsals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rehearsal
  generated-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [static, static-sveltia]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate, independently install and verify the selected profile
        env:
          PLATFORM_PROFILE: ${{ matrix.profile }}
        run: npm run test:profiles -- --profile "$PLATFORM_PROFILE"
